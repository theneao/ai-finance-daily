name: Daily AI finance discovery

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC: 00:30 UTC = 08:30 Asia/Shanghai.
    - cron: "30 0 * * *"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "config.yaml"
      - "requirements.txt"
      - ".github/workflows/daily.yml"

permissions:
  contents: write

concurrency:
  group: ai-finance-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Collect papers and projects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python src/daily_digest.py
      - name: Commit changes
        run: |
          if git diff --quiet -- README.md data archive history; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- README.md data archive
          if [ -d history ]; then
            git add -A -- history
          fi
          git commit -m "chore: update AI finance daily $(date -u +%F)"
          git push
